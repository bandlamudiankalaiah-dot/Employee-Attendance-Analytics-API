openapi: 3.1.0
info:
  title: Employee Attendance & Analytics API
  description: Production-grade Backend API for Employee Attendance Management and Analytics using FastAPI and MongoDB.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      description: Verifies API runtime and MongoDB database connectivity.
      responses:
        '200':
          description: Service healthy and MongoDB connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  mongo_connected:
                    type: boolean
                    example: true
                  db_name:
                    type: string
                    example: "attendance_db"
        '503':
          description: Service unavailable due to database connection failure

  /employees:
    post:
      summary: Create employee
      description: Registers a new employee with shift timings and department. Enforces unique emp_code at database level.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '409':
          description: Employee code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (invalid dates, identical shift start/end, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List employees
      description: Retrieves paginated employees with optional exact case-sensitive department filter.
      parameters:
        - name: department
          in: query
          required: false
          schema:
            type: string
          description: Exact case-sensitive department name
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated employees list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '422':
          description: Invalid query parameters

  /attendance/punch-in:
    post:
      summary: Attendance punch-in
      description: Records punch-in instant for an employee. Computes late_minutes based on shift start and 10-min grace period. Handles overnight shifts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchInRequest'
      responses:
        '201':
          description: Punch-in successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Attendance record already exists for this employee and date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid timestamp or payload

  /attendance/punch-out:
    post:
      summary: Attendance punch-out
      description: Records punch-out instant. Computes work_hours (Decimal half-up), overtime_minutes (>=30 min threshold), and half_day (<4.50 hrs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchOutRequest'
      responses:
        '200':
          description: Punch-out successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '404':
          description: Employee or active punch-in not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already punched out or conflicting update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid timestamp or punch-out before punch-in

  /attendance:
    get:
      summary: List attendance records
      description: Filterable, paginated attendance log query sorted by date descending.
      parameters:
        - name: emp_code
          in: query
          required: false
          schema:
            type: string
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PRESENT, WFH, ON_DUTY, ABSENT, LEAVE]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated attendance logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceListResponse'
        '422':
          description: Validation error

  /attendance/{emp_code}/{date}:
    patch:
      summary: Regularize attendance record
      description: Allows manual corrections to attendance status or timestamps with audit logging. Recalculates derived metrics.
      parameters:
        - name: emp_code
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegularizationRequest'
      responses:
        '200':
          description: Attendance record regularized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '404':
          description: Attendance record or employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Concurrent edit conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid update payload

  /analytics/employees/{emp_code}/monthly:
    get:
      summary: Monthly employee analytics
      description: Computes monthly presence, working days, attendance rate, late minutes, and overtime for an employee.
      parameters:
        - name: emp_code
          in: path
          required: true
          schema:
            type: string
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Reporting month in YYYY-MM format
      responses:
        '200':
          description: Employee monthly analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeMonthlyAnalytics'
        '404':
          description: Employee not found
        '422':
          description: Invalid month format

  /analytics/departments/summary:
    get:
      summary: Department monthly summary
      description: Department-level aggregated headcount, present days, attendance rate, avg late minutes, and avg overtime.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Department summary list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentSummary'
        '422':
          description: Invalid month format

  /analytics/leaderboard/late:
    get:
      summary: Late-comers leaderboard
      description: Ranks employees with the most late arrivals or late minutes using MongoDB window ranking (skipping rank after ties).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Ranked list of late-comers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
        '422':
          description: Invalid query parameters

  /analytics/departments/{department}/trend:
    get:
      summary: Department attendance trend
      description: Daily attendance metrics and 7-day moving average for all days in date range. Zero-filled for days with no records.
      parameters:
        - name: department
          in: path
          required: true
          schema:
            type: string
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Day-by-day attendance trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyTrendEntry'
        '422':
          description: Invalid date range

  /admin/explain/{endpoint}:
    get:
      summary: MongoDB explain plan inspector
      description: Returns raw executionStats query/aggregation explain plan for performance inspection.
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
            enum: [attendance_list, employee_monthly, department_summary, late_leaderboard, department_trend]
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: emp_code
          in: query
          required: false
          schema:
            type: string
        - name: month
          in: query
          required: false
          schema:
            type: string
        - name: date_from
          in: query
          required: false
          schema:
            type: string
        - name: date_to
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: MongoDB explain output
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Unknown endpoint or invalid params

components:
  schemas:
    EmployeeCreate:
      type: object
      required:
        - emp_code
        - name
        - email
        - department
        - shift_start
        - shift_end
        - joined_on
      properties:
        emp_code:
          type: string
          example: "EMP001"
        name:
          type: string
          example: "Aarav Sharma"
        email:
          type: string
          format: email
          example: "aarav.sharma@example.com"
        department:
          type: string
          example: "Engineering"
        shift_start:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "09:30"
        shift_end:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "18:30"
        joined_on:
          type: string
          format: date
          example: "2024-01-15"

    EmployeeResponse:
      type: object
      properties:
        emp_code:
          type: string
        name:
          type: string
        email:
          type: string
        department:
          type: string
        shift_start:
          type: string
        shift_end:
          type: string
        joined_on:
          type: string
        created_at:
          type: string
          format: date-time

    EmployeeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer

    PunchInRequest:
      type: object
      required:
        - emp_code
      properties:
        emp_code:
          type: string
          example: "EMP001"
        punched_at:
          type: integer
          description: Epoch milliseconds (integer only)
          example: 1716177600000
        status:
          type: string
          enum: [PRESENT, WFH, ON_DUTY]
          default: PRESENT

    PunchOutRequest:
      type: object
      required:
        - emp_code
      properties:
        emp_code:
          type: string
          example: "EMP001"
        punched_at:
          type: integer
          description: Epoch milliseconds (integer only)
          example: 1716210000000

    AttendanceResponse:
      type: object
      properties:
        emp_code:
          type: string
        date:
          type: string
          example: "2024-05-20"
        status:
          type: string
          example: "PRESENT"
        punch_in:
          type: integer
          nullable: true
          description: Epoch milliseconds
        punch_out:
          type: integer
          nullable: true
          description: Epoch milliseconds
        late_minutes:
          type: integer
        work_hours:
          type: number
          nullable: true
          example: 8.50
        overtime_minutes:
          type: integer
          example: 0
        half_day:
          type: boolean
          example: false
        history:
          type: array
          items:
            type: object
            properties:
              at:
                type: integer
              by:
                type: string
              reason:
                type: string
              changes:
                type: object

    AttendanceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceResponse'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer

    RegularizationRequest:
      type: object
      required:
        - regularized_by
        - reason
      properties:
        regularized_by:
          type: string
          example: "admin_user"
        reason:
          type: string
          example: "Biometric scanner power outage"
        status:
          type: string
          enum: [PRESENT, WFH, ON_DUTY, ABSENT, LEAVE]
        punch_in:
          type: integer
        punch_out:
          type: integer

    EmployeeMonthlyAnalytics:
      type: object
      properties:
        emp_code:
          type: string
        month:
          type: string
        total_working_days:
          type: integer
        present_days:
          type: number
          example: 21.5
        absent_days:
          type: integer
        half_days:
          type: integer
        attendance_rate:
          type: number
          example: 97.73
        total_late_minutes:
          type: integer
        total_overtime_minutes:
          type: integer

    DepartmentSummary:
      type: object
      properties:
        department:
          type: string
        month:
          type: string
        headcount:
          type: integer
        total_present_days:
          type: number
        avg_attendance_rate:
          type: number
        avg_late_minutes:
          type: number
        avg_overtime_minutes:
          type: number

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        emp_code:
          type: string
        name:
          type: string
        department:
          type: string
        late_days_count:
          type: integer
        total_late_minutes:
          type: integer

    DailyTrendEntry:
      type: object
      properties:
        date:
          type: string
        headcount:
          type: integer
        present_count:
          type: number
        attendance_rate:
          type: number
        seven_day_moving_avg:
          type: number

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
